  assemblies:
  - F23.StringSimilarity
  namespace: F23.StringSimilarity
  summary: Calculates the Damerau-Levenshtein distance between two sequences.
  remarks: >-
    The Damerau-Levenshtein distance is a metric for measuring the difference between two
        sequences. It  extends the Levenshtein distance by allowing transpositions of adjacent characters as a
        single edit  operation. This method is case-sensitive for sequences of characters.
  example: []
  syntax:
    content: 'public double Distance<T>(ReadOnlySpan<T> s1, ReadOnlySpan<T> s2) where T : IEquatable<T>'
    parameters:
    - id: s1
      type: System.ReadOnlySpan{{T}}
      description: The first sequence to compare. Cannot be null.
    - id: s2
      type: System.ReadOnlySpan{{T}}
      description: The second sequence to compare. Cannot be null.
    typeParameters:
    - id: T
      description: The type of elements in the sequences. The type must implement <xref href="System.IEquatable%601" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Double
      description: >-
        The Damerau-Levenshtein distance between the two sequences, which represents the minimum number of 
            single-character edits (insertions, deletions, substitutions, or transpositions) required to transform  one
            sequence into the other.
