  assemblies:
  - F23.StringSimilarity
  namespace: F23.StringSimilarity.Interfaces
  summary: >-
    Compute and return a measure of distance.

    Must be &gt;= 0.


    This method operates on spans such as byte arrays.

    Note that, when used on bytes, string encodings that

    use more than one byte per codepoint (such as UTF-8)

    are not supported and will most likely return

    incorrect results.
  example: []
  syntax:
    content: 'double Distance<T>(ReadOnlySpan<T> b1, ReadOnlySpan<T> b2) where T : IEquatable<T>'
    parameters:
    - id: b1
      type: System.ReadOnlySpan{{T}}
      description: The first span.
    - id: b2
      type: System.ReadOnlySpan{{T}}
      description: The second span.
    typeParameters:
    - id: T
    return:
      type: System.Double
      description: The measure of distance between the spans.
    content.vb: Function Distance(Of T As IEquatable(Of T))(b1 As ReadOnlySpan(Of T), b2 As ReadOnlySpan(Of T)) As Double
