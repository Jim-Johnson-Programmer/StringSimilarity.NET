  assemblies:
  - F23.StringSimilarity
  namespace: F23.StringSimilarity
  summary: Calculates the similarity between two sequences based on their distance.
  remarks: >-
    The similarity is calculated as 1.0 minus the distance between the two
        sequences.
  example: []
  syntax:
    content: 'public double Similarity<T>(ReadOnlySpan<T> s1, ReadOnlySpan<T> s2) where T : IEquatable<T>'
    parameters:
    - id: s1
      type: System.ReadOnlySpan{{T}}
      description: The first sequence to compare.
    - id: s2
      type: System.ReadOnlySpan{{T}}
      description: The second sequence to compare.
    typeParameters:
    - id: T
      description: The type of elements in the sequences. Must implement <xref href="System.IEquatable%601" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Double
      description: >-
        A value between 0.0 and 1.0 representing the similarity of the two sequences,  where 1.0 indicates identical
            sequences and 0.0 indicates completely dissimilar sequences.
