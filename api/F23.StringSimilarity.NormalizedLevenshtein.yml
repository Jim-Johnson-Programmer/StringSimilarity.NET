  assemblies:
  - F23.StringSimilarity
  namespace: F23.StringSimilarity
  summary: Calculates the normalized distance between two sequences of elements.
  remarks: >-
    The distance is normalized by the length of the longer sequence. This ensures the
        result is  always in the range [0.0, 1.0], where 0.0 indicates identical sequences and 1.0 indicates 
        maximum dissimilarity.
  example: []
  syntax:
    content: 'public double Distance<T>(ReadOnlySpan<T> s1, ReadOnlySpan<T> s2) where T : IEquatable<T>'
    parameters:
    - id: s1
      type: System.ReadOnlySpan{{T}}
      description: The first sequence to compare. Cannot be empty or null.
    - id: s2
      type: System.ReadOnlySpan{{T}}
      description: The second sequence to compare. Cannot be empty or null.
    typeParameters:
    - id: T
      description: The type of elements in the sequences. Must implement <xref href="System.IEquatable%601" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Double
      description: >-
        A double value representing the normalized distance between the two sequences.  Returns 0.0 if the sequences
            are equal or both are empty.
    content.vb: Public Function Distance(Of T As IEquatable(Of T))(s1 As ReadOnlySpan(Of T), s2 As ReadOnlySpan(Of T)) As Double
