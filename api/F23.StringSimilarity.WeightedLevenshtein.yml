  assemblies:
  - F23.StringSimilarity
  namespace: F23.StringSimilarity
  summary: Compute Levenshtein distance using provided weights for substitution.
  example: []
  syntax:
    content: public double Distance(string s1, string s2, double limit)
    parameters:
    - id: s1
      type: System.String
      description: The first string to compare.
    - id: s2
      type: System.String
      description: The second string to compare.
    - id: limit
      type: System.Double
      description: >-
        The maximum result to compute before stopping. This
            means that the calculation can terminate early if you
            only care about strings with a certain similarity.
            Set this to Double.MaxValue if you want to run the
            calculation to completion in every case.
    return:
      type: System.Double
      description: The computed weighted Levenshtein distance.
