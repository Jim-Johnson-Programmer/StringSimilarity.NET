  assemblies:
  - F23.StringSimilarity
  namespace: F23.StringSimilarity
  summary: >-
    The Levenshtein distance, or edit distance, between two words is the

    Minimum number of single-character edits (insertions, deletions or

    substitutions) required to change one word into the other.


    http://en.wikipedia.org/wiki/Levenshtein_distance


    It is always at least the difference of the sizes of the two strings.

    It is at most the length of the longer string.

    It is zero if and only if the strings are equal.

    If the strings are the same size, the HamMing distance is an upper bound

    on the Levenshtein distance.

    The Levenshtein distance verifies the triangle inequality (the distance

    between two strings is no greater than the sum Levenshtein distances from

    a third string).


    Implementation uses dynamic programMing (Wagner–Fischer algorithm), with

    only 2 rows of data. The space requirement is thus O(m) and the algorithm

    runs in O(mn).
  example: []
  syntax:
    content: public double Distance(string s1, string s2, int limit)
    parameters:
    - id: s1
      type: System.String
      description: The first string to compare.
    - id: s2
      type: System.String
      description: The second string to compare.
    - id: limit
      type: System.Int32
      description: >-
        The maximum result to compute before stopping. This
             means that the calculation can terminate early if you
             only care about strings with a certain similarity.
             Set this to Int32.MaxValue if you want to run the
             calculation to completion in every case.
    return:
      type: System.Double
      description: The Levenshtein distance between strings
    content.vb: Public Function Distance(s1 As String, s2 As String, limit As Integer) As Double
