  assemblies:
  - F23.StringSimilarity
  namespace: F23.StringSimilarity
  summary: Calculates the distance between two sequences based on their similarity.
  remarks: >-
    The distance is calculated as the complement of the similarity between the two
        sequences.
  example: []
  syntax:
    content: 'public double Distance<T>(ReadOnlySpan<T> s1, ReadOnlySpan<T> s2) where T : IEquatable<T>'
    parameters:
    - id: s1
      type: System.ReadOnlySpan{{T}}
      description: The first sequence to compare.
    - id: s2
      type: System.ReadOnlySpan{{T}}
      description: The second sequence to compare.
    typeParameters:
    - id: T
      description: The type of elements in the sequences. Must implement <xref href="System.IEquatable%601" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Double
      description: >-
        A double value representing the distance between the two sequences. The value ranges from 0.0 to 1.0,  where
            0.0 indicates identical sequences and 1.0 indicates completely dissimilar sequences.
    content.vb: Public Function Distance(Of T As IEquatable(Of T))(s1 As ReadOnlySpan(Of T), s2 As ReadOnlySpan(Of T)) As Double
