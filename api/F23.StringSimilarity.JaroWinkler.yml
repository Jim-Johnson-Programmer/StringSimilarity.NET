  assemblies:
  - F23.StringSimilarity
  namespace: F23.StringSimilarity
  summary: Calculates the similarity between two sequences using the Jaro-Winkler distance metric.
  remarks: >-
    The similarity is calculated using the Jaro-Winkler distance, which is a measure of
        similarity between two sequences. The result is adjusted based on common prefixes to give higher scores to
        sequences that share a common prefix.
  example: []
  syntax:
    content: 'public double Similarity<T>(ReadOnlySpan<T> s1, ReadOnlySpan<T> s2) where T : IEquatable<T>'
    parameters:
    - id: s1
      type: System.ReadOnlySpan{{T}}
      description: The first sequence to compare. Cannot be null.
    - id: s2
      type: System.ReadOnlySpan{{T}}
      description: The second sequence to compare. Cannot be null.
    typeParameters:
    - id: T
      description: The type of elements in the sequences. Must implement <xref href="System.IEquatable%601" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Double
      description: >-
        A value between 0 and 1 representing the similarity between the two sequences, where 1 indicates identical
            sequences and 0 indicates no similarity.
    content.vb: Public Function Similarity(Of T As IEquatable(Of T))(s1 As ReadOnlySpan(Of T), s2 As ReadOnlySpan(Of T)) As Double
