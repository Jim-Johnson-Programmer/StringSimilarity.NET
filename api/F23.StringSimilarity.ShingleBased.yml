    path: src/F23.StringSimilarity/ShingleBased.cs
    startLine: 76
  assemblies:
  - F23.StringSimilarity
  namespace: F23.StringSimilarity
  summary: >-
    Generates a profile of k-length substrings (shingles) from the specified string, along with their frequency

    of occurrence.
  remarks: >-
    This method processes the input string by normalizing spaces and then extracting
        overlapping substrings of length k. The resulting dictionary provides a frequency count for each unique
        shingle.
  example: []
  syntax:
    content: public Dictionary<string, int> GetProfile(string s)
    parameters:
    - id: s
      type: System.String
      description: The input string from which to generate the shingle profile. Cannot be null.
    return:
      type: System.Collections.Generic.Dictionary{System.String,System.Int32}
      description: >-
        A dictionary where the keys are k-length substrings (shingles) extracted from the input string, and the
            values are the number of times each shingle appears.
    content.vb: Public Function GetProfile(s As String) As Dictionary(Of String, Integer)
  overload: F23.StringSimilarity.ShingleBased.GetProfile*
