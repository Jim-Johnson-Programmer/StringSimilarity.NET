  assemblies:
  - F23.StringSimilarity
  namespace: F23.StringSimilarity
  summary: Calculates the Damerau-Levenshtein distance between two sequences.
  remarks: >-
    The Damerau-Levenshtein distance is a metric for measuring the edit distance between
        two sequences, allowing for the following operations: <ul><li>Insertion of a
        single element.</li><li>Deletion of a single element.</li><li>Substitution of one element for another.</li><li>Transposition of two adjacent elements.</li></ul> This method is
        case-sensitive for sequences of strings or characters.
  example: []
  syntax:
    content: 'public double Distance<T>(ReadOnlySpan<T> s1, ReadOnlySpan<T> s2) where T : IEquatable<T>'
    parameters:
    - id: s1
      type: System.ReadOnlySpan{{T}}
      description: The first sequence to compare. Cannot be <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
    - id: s2
      type: System.ReadOnlySpan{{T}}
      description: The second sequence to compare. Cannot be <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
    typeParameters:
    - id: T
      description: The type of elements in the sequences. Must implement <xref href="System.IEquatable%601" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Double
      description: >-
        The Damerau-Levenshtein distance between the two sequences, which represents the minimum number of operations
            (insertions, deletions, substitutions, or transpositions) required to transform one sequence into the other.
            Returns 0 if the sequences are equal.
    content.vb: Public Function Distance(Of T As IEquatable(Of T))(s1 As ReadOnlySpan(Of T), s2 As ReadOnlySpan(Of T)) As Double
